# Example VAE Training Configuration
# This file demonstrates how to configure the DELIGHT VAE model

# Experiment settings
exp_name: 'example_vae_training'

# Data configuration
data:
  dataset: 'ShapeNetCore.v2'
  categories: 'chair'  # Options: 'chair', 'airplane', 'car', 'table', etc.
  n_sample_points: 2048
  batch_size: 32
  batch_size_test: 32
  num_workers: 4
  normalize_global: True

# VAE model configuration
vae:
  latent_dim: 512
  input_dim: 3
  quantizer: 'softvq'  # Options: 'softvq' or 'kl'
  
  # KL annealing settings (optional)
  anneal_kl: False
  kl_weight: 1.0
  
  # Soft Vector Quantization settings
  softvq:
    n_e: 64  # Number of embeddings per codebook
    e_dim: 32  # Dimension of each embedding
    num_codebooks: 32  # Number of codebooks
    learnable: True  # Learn temperature
    tau: 0.07  # Initial temperature
    entropy_loss_ratio: 0.01
    l2_norm: True  # Normalize embeddings
  
  # Flow model settings
  flow:
    depth: 3
    cfm_method: 'ot'  # Options: 'independent', 'ot', 'variance', 'target', 'schrodinger_bridge'
    solver: 'dopri5'  # ODE solver
    atol: 1e-4
    rtol: 1e-4
    sigma: 0.0
    use_hybrid_coupling: True
    beta: 0.2
    use_xformers: True

# Training configuration
training:
  type: 'vae'
  epochs: 500
  
  # Optimizer settings
  opt:
    type: 'adamw'
    lr: 0.0001
    weight_decay: 0.01
    ema: True
    ema_decay: 0.9999
    scheduler: 'cosine_anneal_nocycle'

# Visualization and logging
vis:
  log_freq: -1
  vis_freq: -50
  save_freq: 50
  val_freq: 25
